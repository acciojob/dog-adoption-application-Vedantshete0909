
<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <script type="text/javascript" src="./script.js"></script>

    <form>
        <label for="name">Name</label>
        <br>
        <input type="text" id="name" name="name" placeholder="Name">
        <br><br>

        <label for="phone">Phone</label>
        <br>
        <input type="text" id="phone" name="phone" placeholder="Phone Number">
        <br><br>

        <label for="address">Address</label>
        <br>
        <input type="text" id="address" name="address">
        <br><br>

        <label>Have you ever lived with a Dog before?</label>
        <br><br>

        <input type="checkbox" id="checkbox" name="dog_experience" value="Yes">
        <label for="checkbox">Yes</label>

        <input type="checkbox" id="checkbox-no" name="dog_experience" value="No">
        <label for="checkbox-no">No</label>

        <br><br>

        <label for="breeds">Please select your preferred breeds</label>
        <br>

        <select id="breeds" name="breeds">
            <option value="labra">labra</option>
            <option value="dobarman">dobarman</option>
            <option value="shinzo">shinzo</option>
        </select>

        <br><br>

        <button type="submit" value="Submit">Submit</button>
    </form>
</body>
</html>
